name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: engine

env:
  CARGO_TERM_COLOR: always
  MSRV: "1.95"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: fontconfig for system fonts in the render crate
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude spike-layout --all-targets -- -D warnings
      - name: TypeScript bindings are current
        run: |
          rm -rf bindings
          cargo test -p s-md-slides --features ts --lib
          git diff --exit-code -- bindings
          test -z "$(git status --porcelain -- bindings)"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: fontconfig for system fonts in the render crate
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      # The M0 layout spike is kept for reference only.
      - run: cargo test --workspace --exclude spike-layout --release

  wasm-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Core WASM size (fails above 1.5 MB)
        run: scripts/wasm-size.sh wasm-probe | tee -a "$GITHUB_STEP_SUMMARY"

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Build the runtime and check the committed copy is current
        run: |
          cd runtime
          npm ci
          npm run build
          git diff --exit-code -- ../crates/core/src/runtime
      - name: Browser check (headless Chrome, axe-core)
        run: CHROME_PATH=$(which google-chrome) node runtime/test/check.mjs
      - name: Browser check (headless Firefox)
        run: BROWSER=firefox FIREFOX_PATH=$(which firefox) node runtime/test/check.mjs
