name: ci

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: engine

env:
  CARGO_TERM_COLOR: always
  MSRV: "1.95"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude spike-layout --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      # The layout spike (krilla, resvg, parley) waits for M5 and is slow to build.
      - run: cargo test --workspace --exclude spike-layout --release

  wasm-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Core WASM size (fails above 1.5 MB)
        run: scripts/wasm-size.sh wasm-probe | tee -a "$GITHUB_STEP_SUMMARY"
