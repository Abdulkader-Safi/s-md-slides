name: release

# FR-PKG-01. Push a tag like v0.1.0 to publish the three crates to crates.io, build
# the s-md-slides binary for four platforms, and attach the binaries, the
# conformance vectors and the third-party notices to a GitHub release.
# Needs the CARGO_REGISTRY_TOKEN secret, unless the crates were published by hand. Actions are pinned to commit SHAs and
# release builds skip the cache, because this workflow holds the publish token.
on:
  push:
    tags: ["v*.*.*"]

defaults:
  run:
    working-directory: engine

env:
  CARGO_TERM_COLOR: always
  MSRV: "1.95"

# Read-only by default; only the publish job can write (to create the release).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master on 2026-11-16
        with:
          toolchain: ${{ env.MSRV }}
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: The tag matches the crate version
        run: |
          v=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but crates are $v"; exit 1; }
      - run: cargo test --workspace --release
      - name: Every crate packages and builds from its package
        run: cargo package --workspace --exclude wasm-probe

  binaries:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master on 2026-11-16
        with:
          toolchain: ${{ env.MSRV }}
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-about@0.9.2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo build --release -p s-md-slides-cli --target ${{ matrix.target }}
      - name: Archive the binary with its notices
        shell: bash
        run: |
          name=s-md-slides-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p dist/$name
          cargo about generate about.hbs -o dist/$name/THIRD_PARTY_NOTICES.html
          cp ../README.md crates/render/assets/fonts/OFL.txt dist/$name/
          cp ../LICENSE dist/$name/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/s-md-slides.exe dist/$name/
            (cd dist && 7z a $name.zip $name >/dev/null)
          else
            cp target/${{ matrix.target }}/release/s-md-slides dist/$name/
            tar -C dist -czf dist/$name.tar.gz $name
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.target }}
          path: |
            engine/dist/*.tar.gz
            engine/dist/*.zip

  publish:
    needs: [check, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master on 2026-11-16
        with:
          toolchain: ${{ env.MSRV }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-about@0.9.2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      # A crate already on crates.io at this version (published by hand) is skipped,
      # so the binaries and the GitHub release still get made.
      - name: Publish core, then render, then the CLI
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          v=${GITHUB_REF_NAME#v}
          for c in s-md-slides s-md-slides-render s-md-slides-cli; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: s-md-slides-release' "https://crates.io/api/v1/crates/$c/$v")
            if [ "$code" = 200 ]; then
              echo "$c $v is already published, skipping"
            else
              cargo publish -p "$c"
            fi
          done
      - name: Conformance vectors and notices
        run: |
          mkdir -p dist
          zip -qr dist/conformance-${GITHUB_REF_NAME#v}.zip conformance
          cargo about generate about.hbs -o dist/THIRD_PARTY_NOTICES.html
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bin-*
          path: engine/dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
