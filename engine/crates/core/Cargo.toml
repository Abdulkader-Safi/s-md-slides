[package]
name = "s-md-slides"
version = "0.0.0"
description = "Free-canvas slide decks stored in one readable markdown file"
readme = "../../README.md"
keywords = ["slides", "markdown", "presentation"]
categories = ["parser-implementations", "text-processing"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
pulldown-cmark.workspace = true
ts-rs = { workspace = true, optional = true, features = ["serde-json-impl", "no-serde-warnings"] }

[features]
# Generates TypeScript types for hosts into engine/bindings/ (`cargo test --features ts`).
ts = ["dep:ts-rs"]

[dev-dependencies]
proptest.workspace = true
insta = { workspace = true, features = ["json"] }
serde_json.workspace = true
