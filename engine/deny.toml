# License and supply-chain checks (NFR-09). Run: cargo deny check

[graph]
all-features = true
exclude-dev = true

[licenses]
# Permissive licenses only: nothing GPL or AGPL ships in the engine.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    # Independent JPEG Group license (jpeg-encoder): permissive, attribution only.
    "IJG",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
ignore = [
    # rustybuzz and ttf-parser are unmaintained, with no safe upgrade. They come in
    # through resvg/usvg (PNG and PDF) and parley's font stack, in the native render
    # crate only; the core does not use them. Revisit when resvg moves off them.
    { id = "RUSTSEC-2026-0206", reason = "unmaintained, no upgrade; via resvg and parley" },
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, no upgrade; via resvg and parley" },
]
