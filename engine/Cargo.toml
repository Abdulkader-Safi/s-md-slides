[workspace]
resolver = "3"
members = ["spikes/core", "spikes/wasm"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/Abdulkader-Safi/s-md-slides"

# Every version pinned exactly, checked on crates.io on 2026-11-15.
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde-saphyr = { version = "=2.1.1", default-features = false, features = ["deserialize"] }
pulldown-cmark = { version = "=0.13.6", default-features = false, features = ["html"] }
wasm-bindgen = "=0.2.130"
proptest = "=1.12.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
